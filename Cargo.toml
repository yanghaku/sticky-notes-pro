[package]
name = "sticky-notes-pro"
version = "0.1.1"
edition = "2024"
rust-version = "1.92"
description = "A lightweight and high performance sticky notes editor"
publish = false

[dependencies]
anyhow = "1"
arboard = { version = "3", default-features = false }
chrono = "0.4"
cosmic-text = "0.19"
directories = "6"
fs2 = "0.4"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "=1.17.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2", "unstable-winit-030"] }
tempfile = "3"
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
slint-build = "=1.17.1"
winresource = "0.1.31"

[profile.release]
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 2

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
correctness = "deny"
